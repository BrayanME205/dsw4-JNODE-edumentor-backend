spring.application.name=edumentorhub-backend
server.port=8080

# --- Base de datos: H2 en archivo (por defecto) ---
spring.datasource.url=jdbc:h2:file:./data/edumentor;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Alternativa SQL Server (comentar H2 y descomentar) ---
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=edumentor;encrypt=false
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.datasource.username=<usuario>
# spring.datasource.password=<clave>

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- JWT (REQ-06) ---
app.jwt.secret=cambiar-este-secreto-por-uno-de-al-menos-32-caracteres
app.jwt.expiration-ms=3600000

# --- CORS: origen del frontend Angular ---
app.cors.allowed-origin=http://localhost:4200
